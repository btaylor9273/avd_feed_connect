# Flatpak manifest for AVD Feed + Connect (Linux).
#
# Bundles a purpose-built SDL3 FreeRDP client so the app connects end-to-end on
# any machine, with two things a stock FreeRDP lacks:
#   * the pulse hot-unplug + rdpsnd busy-loop fixes (FreeRDP PR #13334, now
#     MERGED to upstream master) — without them an audio-device change mid Teams
#     call FREEZES the whole session.
#   * the camera-redirection channel (-DCHANNEL_RDPECAM_CLIENT=ON).
#
# The upstream project also bundles a Teams call-optimization add-in. It is
# deliberately NOT included here: that module builds with network access and
# resolves Rust crates plus a prebuilt libwebrtc at build time, so it cannot be
# built air-gapped and its dependency set is not pinned or auditable. The app's
# Teams settings stay visible but inert without the plugin.
#
# Builds and runs on GNOME 51; every source is pinned to a commit for
# reproducibility.
app-id: io.github.btaylor9273.avd_feed_connect
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: avd-feed-connect

finish-args:
  - --share=network                 # feed discovery, AAD sign-in, RDP gateway
  - --share=ipc
  # Real X11 socket (not fallback-x11): the bundled FreeRDP SDL client is
  # unstable on native Wayland, so connections are forced onto X11/XWayland and
  # the socket must exist even on a Wayland host. The launcher GUI renders via
  # XWayland there too. (Only one graphics socket — Flathub disallows x11+wayland.)
  - --socket=x11
  - --socket=pulseaudio             # RDP audio playback + microphone redirect
  - --device=dri                    # GPU for the RDP graphics pipeline
  - --device=all                    # webcam (camera redirection) + input
  - --talk-name=io.github.btaylor9273.AvdWorkspaces  # optional GNOME workspace extension
  - --talk-name=org.kde.StatusNotifierWatcher   # tray icon
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets         # login keyring (libsecret) for the refresh token
  # Smart card (CAC/PIV) access via the HOST's pcscd: flatpak binds the daemon
  # socket in and sets PCSCLITE_CSOCK_NAME, which the bundled libpcsclite
  # honours. Needed so the card can sign the Entra certificate-based sign-in
  # handshake. No reader driver ships here — pcscd on the host owns the reader.
  - --socket=pcsc
  # Point OpenSC at the config installed above, which pins the PIV driver.
  - --env=OPENSC_CONF=/app/etc/opensc.conf
  - --env=LD_LIBRARY_PATH=/app/lib

# NOTE on ffmpeg: FreeRDP is built WITH_FFMPEG against the GNOME runtime's own
# ffmpeg (its freedesktop base ships libav*). The org.freedesktop.Platform
# .ffmpeg-full extension is intentionally NOT used. If the audin microphone path
# needs the AAC encoder and the base ffmpeg lacks it, add a bundled ffmpeg here.

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # ---- SDL3 + SDL3_ttf (not in the GNOME runtime) ------------------------
  - name: sdl3
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_STATIC=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        tag: release-3.2.30
        commit: f5e5f6588921eed3d7d048ce43d9eb1ff0da0ffc
      # Failed remote clipboard reads must complete across XWayland too.
      # Temporary backport of SDL#16568; remove with an SDL version containing it.
      # Track the SDL update and patch removal in avd_feed_connect#49.
      - type: patch
        path: patches/sdl3-0001-x11-preserve-target-in-failed-selection-notify.patch

  - name: sdl3-ttf
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # Use the runtime's freetype; skip vendored harfbuzz (its in-source CMake
      # guard breaks the build) and plutosvg — the FreeRDP SDL UI is plain text.
      - -DSDLTTF_VENDORED=OFF
      - -DSDLTTF_HARFBUZZ=OFF
      - -DSDLTTF_PLUTOSVG=OFF
      - -DSDLTTF_SAMPLES=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL_ttf.git
        tag: release-3.2.2
        commit: a1ce3670aec736ecbf0936c43f2f0cc53aa61e5b

  # ---- small FreeRDP deps not guaranteed in the runtime ------------------
  - name: cjson
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_CJSON_TEST=OFF
      - -DBUILD_SHARED_AND_STATIC_LIBS=OFF
      # cJSON's cmake_minimum_required predates CMake 3.5, which the GNOME
      # SDK's CMake refuses; allow it to configure anyway.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/DaveGamble/cJSON.git
        tag: v1.7.18
        commit: acc76239bee01d8e9c858ae2cab296704e52d916

  # libusb-1.0 — required by the rdpecam V4L camera subsystem (UVC H.264).
  # (The V4L HAL itself only needs <linux/videodev2.h>, which the SDK ships, so
  # no libv4l package is required.)
  - name: libusb
    buildsystem: autotools
    config-opts:
      - --disable-udev
    sources:
      - type: archive
        url: https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2
        sha256: ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575

  # libcbor + libfido2 — required by FreeRDP's rdpewa channel (MS-RDPEWA),
  # which redirects in-session WebAuthn/FIDO2 calls to a real local security
  # key (as opposed to /usb: raw USB passthrough of the whole device).
  - name: libcbor
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DWITH_TESTS=OFF
      - -DWITH_EXAMPLES=OFF
    sources:
      - type: git
        url: https://github.com/PJK/libcbor.git
        tag: v0.14.0
        commit: 6730c20ab487c0b4dc5fb3fea918937085355bac

  - name: libfido2
    buildsystem: cmake-ninja
    config-opts:
      # RelWithDebInfo, not Release: libfido2 unconditionally appends its own
      # -D_FORTIFY_SOURCE=2 to CMAKE_C_FLAGS_RELEASE, which conflicts with the
      # SDK toolchain's own -D_FORTIFY_SOURCE=3 hardening flag (hard error).
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DBUILD_MANPAGES=OFF
      - -DUSE_PCSC=OFF
    sources:
      - type: git
        url: https://github.com/Yubico/libfido2.git
        tag: 1.17.0
        commit: b974e7cf2ee7392134cc12c08b76a068cf250dd8

  # ---- the FreeRDP SDL3 client, our -cam tree with the pulse fixes -------
  - name: freerdp
    buildsystem: cmake-ninja
    builddir: true    # FreeRDP forbids in-source builds
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_CLIENT_SDL=ON
      - -DWITH_CLIENT_SDL3=ON
      - -DWITH_CLIENT_SDL2=OFF
      - -DWITH_SERVER=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_AAD=ON            # connection-time AAD token acquisition
      # No FreeRDP-side WebView: WITH_WEBVIEW=OFF makes /sec:aad print
      # "Browse to: <url>" and read the redirect URL from stdin. The app drives
      # that over a PTY and resolves the URL in its own hidden webview (sharing
      # the launcher's SSO cookies), so the connection-time token is silent and
      # there is no second embedded browser to blank out / crash.
      - -DWITH_WEBVIEW=OFF
      - -DWITH_PULSE=ON
      - -DWITH_FFMPEG=ON
      - -DWITH_SWSCALE=ON
      - -DWITH_X11=ON
      - -DWITH_KRB5=OFF          # AVD gateway uses AAD, not kerberos — keeps deps lean
      - -DWITH_FUSE=OFF          # FUSE clipboard file-copy; not needed, avoids fuse3 dep
      - -DWITH_MANPAGES=OFF
      - -DCHANNEL_RDPECAM_CLIENT=ON
      - -DCHANNEL_RDPEWA=ON              # in-session WebAuthn/FIDO2 redirection
      - -DCHANNEL_RDPEWA_CLIENT=ON
      - -DWINPR_UTILS_IMAGE_PNG=ON
      - -DWINPR_UTILS_IMAGE_JPEG=ON
      - -DWINPR_UTILS_IMAGE_WEBP=ON
      - -DWINPR_UTILS_IMAGE_DIBv5=ON
    sources:
      - type: git
        url: https://github.com/FreeRDP/FreeRDP.git
        # FreeRDP 3.32.2. Besides the pulse hot-unplug + rdpsnd busy-loop
        # fixes (PR #13334), the rdpecam stream-drain LED fix (3.32.0), the
        # rdpecam media-type validation fix (249d74364a) that makes V4L camera
        # redirection work, and the cliprdr fixes (#13496, #13527) that stop
        # the WinPR assert abort (#7), it includes the XWayland local → remote
        # clipboard support (#13569) and its follow-ups that we used to carry
        # as patches: the escape-decoder hang on text like "C:\users" (#13616)
        # and the synthesized-string size fix (e0931b4af9) — without that, the
        # converted text was sent without its terminating null and Windows
        # dropped the last character of every paste. Camera redirection is a
        # build option, enabled via config-opts.
        tag: 3.32.2
        commit: 97eff6ddfbbfaa8e42a126d362686bd001ff8bdc
      # 3.32.2 counts the terminating '\0' in synthesized text (needed on the
      # wire), and the SDL client passed it on to local applications, so text
      # copied from the cloud PC pasted with a stray character at the end.
      # Upstream as FreeRDP#13705 (not merged yet); drop once the pinned tag
      # includes it.
      - type: patch
        paths:
          - patches/freerdp-0001-client-sdl-strip-terminating-null-from-local-text.patch

  # ---- smart card (CAC/PIV) support -------------------------------------
  # Placed LAST, right before the app: flatpak-builder caches modules as a
  # chain, so appending here keeps the expensive SDL3 -> FreeRDP chain cached.
  #
  # pcsc-lite is the CLIENT library only; pcscd runs on the HOST and is reached
  # through --socket=pcsc, so none of the daemon's dependencies are wanted.
  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibsystemd=false
      - -Dlibudev=false
      - -Dlibusb=false
      - -Dpolkit=false
      - -Dserial=false
      - -Dusbdropdir=/app/lib/pcsc/drivers
    cleanup:
      - /bin
      - /sbin
      - /include
      - /lib/pkgconfig
      - /share/doc
      - /share/man
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.3.tar.xz
        sha256: fe2bb733ecf95e52768907eb00da9f9f3daf180960283e514a05dcc090afa3bd

  # OpenSC provides the PKCS#11 module that reads a CAC/PIV card. GnuTLS (via
  # glib-networking, which this runtime builds WITH PKCS#11) loads it through
  # p11-kit for the client-certificate handshake Entra requires. opensc-tool
  # and pkcs11-tool are kept as the only in-sandbox diagnostics.
  - name: opensc
    buildsystem: autotools
    config-opts:
      # OpenSC's --enable-strict (its default) adds -Werror, and its own getopt
      # compat shim trips -Werror=discarded-qualifiers. Upstream treats that as
      # a warning; turn strict off rather than patch a vendored file.
      - --disable-strict
      # Without this it pkg-config-detects /usr/share/bash-completion, which
      # is read-only during the build.
      - --with-completiondir=/app/share/bash-completion/completions
      - --disable-static
      - --disable-openct
      - --disable-ctapi
      - --enable-pcsc
      - --disable-tests
      - --disable-doc
      - --disable-openpace
      - --with-pcsc-provider=libpcsclite.so.1
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/doc
      - /share/man
      - /share/bash-completion
    post-install:
      # Force the PIV driver. This card is both a PIV card and a CAC, and
      # OpenSC 0.26 prefers its "cac" driver, which exposes objects labelled
      # "CAC Cert 4"/"CAC Cert 5" with no identifiable authentication
      # certificate. The PIV view is the one that carries "Certificate for PIV
      # Authentication" (slot 9A) — the credential Entra's certificate-based
      # sign-in needs — so pin the driver rather than guess at CAC labels.
      - install -d /app/etc
      - printf 'app default {\n    card_drivers = PIV-II, default;\n}\n' > /app/etc/opensc.conf
    sources:
      - type: archive
        url: https://github.com/OpenSC/OpenSC/releases/download/0.26.1/opensc-0.26.1.tar.gz
        sha256: f16291a031d86e570394762e9f35eaf2fcbc2337a49910f3feae42d54e1688cb

  # ---- the app itself ----------------------------------------------------
  - name: avd-feed-connect
    buildsystem: simple
    build-commands:
      - install -d /app/share/avd-feed-connect
      - cp -r src/avd_feed_connect /app/share/avd-feed-connect/avd_feed_connect
      - find /app/share/avd-feed-connect/avd_feed_connect -name __pycache__ -type d -exec rm -rf {} +
      - install -Dm755 src/avdfeed.py       /app/share/avd-feed-connect/avdfeed.py
      - install -Dm755 src/avd_feed_gui.py  /app/share/avd-feed-connect/avd_feed_gui.py
      - install -Dm755 avd-feed-connect     /app/bin/avd-feed-connect
      - install -Dm644 io.github.btaylor9273.avd_feed_connect.desktop
        /app/share/applications/io.github.btaylor9273.avd_feed_connect.desktop
      - install -Dm644 io.github.btaylor9273.avd_feed_connect.metainfo.xml
        /app/share/metainfo/io.github.btaylor9273.avd_feed_connect.metainfo.xml
      - install -Dm644 io.github.btaylor9273.avd_feed_connect.svg
        /app/share/icons/hicolor/scalable/apps/io.github.btaylor9273.avd_feed_connect.svg
      - install -Dm644 io.github.btaylor9273.avd_feed_connect-symbolic.svg
        /app/share/icons/hicolor/symbolic/apps/io.github.btaylor9273.avd_feed_connect-symbolic.svg
      # Tray icon dir handed to the host as IconThemePath. Quickshell loads
      # <dir>/<IconName> verbatim (no extension); other hosts add ".svg".
      - install -Dm644 io.github.btaylor9273.avd_feed_connect-symbolic.svg
        /app/share/avd-feed-connect/tray/io.github.btaylor9273.avd_feed_connect-symbolic.svg
      - install -Dm644 io.github.btaylor9273.avd_feed_connect-symbolic.svg
        /app/share/avd-feed-connect/tray/io.github.btaylor9273.avd_feed_connect-symbolic
    sources:
      # Build the checked-out tree, so cloning this repo and running
      # ./build.sh produces THIS code. (Upstream pins a published commit here
      # instead, which would make a clone build upstream's app rather than
      # yours.) Everything else in this manifest is pinned by commit or
      # sha256, so the build is still reproducible.
      - type: dir
        path: .
